/* Phone -> international form (+92XXXXXXXXXX). Accepts 03XX-XXXXXXX, 3XXXXXXXXX, 92XXXXXXXXXXX, +92 3XX XXXXXXX,
   0092..., Urdu/Arabic digits, and fields holding several numbers (first valid one is used). */
const pnum=v=>{
 const s=String(v==null?'':v).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-1776);
 const one=t=>{
  const raw=t.trim(),plus=raw.charAt(0)==='+';let d=raw.replace(/\D/g,'');
  if(d.length<10)return '';
  if(d.startsWith('00'))return d.length>=12&&d.length<=17?'+'+d.slice(2):'';
  if(d.startsWith('920')&&d.length==13)d='92'+d.slice(3);
  if(plus)return d.length<=15?'+'+d:'';
  if(d.startsWith('92')&&d.length==12)return '+'+d;
  if(d.charAt(0)=='0'&&(d.length==11||d.length==10))return '+92'+d.slice(1);
  if(d.length==10&&d.charAt(0)=='3')return '+92'+d;
  return d.length<=15?'+'+d:'';
 };
 for(const t of s.split(/[\/,;|\n\r]+|\s+(?:or|and|&)\s+/i)){const r=one(t);if(r)return r}
 return one(s);
};

/* ===== AUTOMATIC FEE RECEIPTS + STAFF SALARY SMS ===== */
function payrollSmsSettings(){
 const x=db.paySms=db.paySms||{};
 if(x.feeOn===undefined)x.feeOn=true;
 if(x.salOn===undefined)x.salOn=true;
 if(x.salWaPdfOn===undefined)x.salWaPdfOn=true;
 if(x.feeTpl===undefined)x.feeTpl='Dear {father}, fee payment received for {name} ({class}). Amount: {amount}. Month: {month}. Balance: {balance}. Receipt date: {date}. - {school}';
 if(x.salTpl===undefined)x.salTpl='Dear {name}, your salary payment has been processed. Month: {month}. Salary: {salary}. Advance: {advance}. Paid now: {amount}. Total paid: {paid}. Remaining: {balance}. Date: {date}. - {school}';
 return x;
}
function paySmsRender(tpl,data){return tpl.replace(/\{(\w+)\}/g,(m,k)=>data[k.toLowerCase()]===undefined?m:String(data[k.toLowerCase()]??''));}
function sendTransactionSms(person,message){
 const n=smsNum(person);
 if(!n){toast('⚠️','SMS not sent: no valid registered phone number','c3');return}
 try{
  if(window.AndroidSms&&AndroidSms.sendBulkSms){
   AndroidSms.sendBulkSms(JSON.stringify([n]),message);
   toast('📩','SMS send requested for '+(person.name||'recipient'),'c6');
  }else{
   if(!confirm('Payment saved.\n\nOpen the SMS app to send the receipt to '+(person.name||'the parent')+' ('+n+')?'))return;
   const a=document.createElement('a');a.href='sms:'+n+(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(message);a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
  }
 }catch(e){toast('⚠️','Could not start SMS. Check the phone SMS permission.','c4')}
}
function feeReceiptSms(s,amount,month){
 const x=payrollSmsSettings();if(!x.feeOn)return;
 const paid=fp(s.id,month),balance=Math.max(0,(+s.fee||0)-paid);
 sendTransactionSms(s,paySmsRender(x.feeTpl,{name:s.name,father:s.father||'Parent',class:s.cls||'',amount:fmt(amount),month:ml(month),balance:fmt(balance),date:dmy(TD()),school:SCH}));
}
function salaryPaidSms(s,amount,month){
 const x=payrollSmsSettings();if(!x.salOn)return;
 const p=sl(s.id,month),balance=Math.max(0,(+s.sal||0)-p.a-p.p);
 sendTransactionSms(s,paySmsRender(x.salTpl,{name:s.name,amount:fmt(amount),month:ml(month),salary:fmt(s.sal||0),advance:fmt(p.a),paid:fmt(p.p),balance:fmt(balance),date:dmy(TD()),school:SCH}));
}

 <p style="font-size:12px;color:var(--mut)">When enabled, a receipt message is sent to the student's registered phone after a fee payment, and a salary message is sent to the staff member's registered phone after salary is paid. Automatic SIM sending requires this page to run inside the Fatima School SMS Android app with SMS permission and an active SIM. In a normal browser, the SMS app opens with the message ready; you must press Send.</p>
 <label class="ck"><input type="checkbox" id="feeSmsOn" ${x.feeOn?'checked':''}> Send SMS after student fee payment</label>

 <small>Available fields: {name} {father} {class} {amount} {month} {balance} {date} {school}</small>

 <label>Staff salary message</label><textarea id="salSmsTpl" rows="4">${esc(x.salTpl)}</textarea>

 <div style="margin-top:10px"><button class="b c1" onclick="savePayrollSmsSettings()">💾 Save payment SMS settings</button></div></div>`;

/* Replace payment handlers so the SMS is triggered only after a real amount is recorded. */
payFee=function(id,checked){
 const s=db.st.find(x=>x.id==id);if(!s)return;
 const before=fp(id,S.m),after=checked?(+s.fee||0):0;
 db.fee[id+'|'+S.m]=after;save();R();
 if(after>before)feeReceiptSms(s,after-before,S.m);
};
partOk=function(id){
 const s=db.st.find(x=>x.id==id),field=document.getElementById('pa');if(!s||!field)return;
 const prev=fp(id,S.m),balance=Math.max(0,(+s.fee||0)-prev),amount=Math.round(Number(String(field.value).replace(/,/g,'')));
 if(!Number.isFinite(amount)||amount<=0){alert('Please enter a valid payment amount greater than zero.');field.focus();return}
 if(amount>balance){alert('Amount cannot exceed the remaining balance of '+fmt(balance)+'.');field.focus();return}
 db.fee[id+'|'+S.m]=prev+amount;db.pay=db.pay||[];
 db.pay.push({id:nid(),sid:id,m:S.m,amt:amount,date:TD()});
 try{save()}catch(e){}
 cl();
 try{R()}catch(e){console.error(e)}
 try{toast('✅','Partial fee saved: '+fmt(amount)+' (balance '+fmt(balance-amount)+')','c6')}catch(e){}
 setTimeout(()=>{try{feeReceiptSms(s,amount,S.m)}catch(e){console.error(e)}},350);
};
paySal=function(id,full){
 const s=db.sf.find(x=>x.id==id);if(!s)return;
 const x=sl(id,S.m),rem=Math.max(0,(+s.sal||0)-x.a-x.p);if(rem<=0)return alert('Already fully paid');
 const apply=n=>{
  const amount=Math.min(rem,Math.max(0,Number(n)||0));if(!amount)return alert('Enter a valid salary payment amount');
  db.sal[id+'|'+S.m]={p:x.p+amount,a:x.a};save();R();salaryPaidSms(s,amount,S.m);
  const opts=payrollSmsSettings();
  if(opts.salWaPdfOn){
   setTimeout(()=>{
    const n=pnum(s.phone)||pnum(s.phone2);
    if(!n){alert('Salary saved. Add a valid phone number for '+s.name+' to share the PDF receipt on WhatsApp.');return}
    if(confirm('Salary payment saved for '+s.name+'. Create and share the PDF salary receipt on WhatsApp now?')){
     window._rcEnd=S.m;
     if(typeof window.shareA4==='function')window.shareA4('sal',id,1,true);
     else alert('PDF receipt feature is not ready. Open Payment History → Teacher Salary to share it.');
    }
   },450);
  }
 };
 if(full)apply(rem);
 else form('Partial Salary - '+s.name,[{k:'a',l:'Amount (remaining '+rem+')',t:'number'}],o=>apply(o.a));
};

/* ===== FEE MANAGEMENT (rebuilt): payment ledger, Edit, multiple partial payments, receipt with calculations ===== */
const fk=(id,m)=>id+'|'+m,fnum=v=>Math.max(0,Math.round(Number(String(v==null?'':v).replace(/,/g,''))||0)),fn=n=>Math.round(n).toLocaleString('en-US');
const fcmp=(a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:a.id-b.id;
/* Ledger of payments for one student+month. Legacy totals (no dated entries) show as "Previously recorded". mig=true saves that cleanup. */
function feeLedger(id,m,mig){
 db.pay=db.pay||[];const tot=fp(id,m);
 let L=db.pay.filter(p=>p.sid==id&&p.m==m).sort(fcmp),sum=L.reduce((a,p)=>a+(+p.amt||0),0),out=[];
 if(sum>tot){let ex=sum-tot;for(let i=L.length-1;i>=0&&ex>0;i--){const c=Math.min(ex,+L[i].amt||0);L[i].amt=(+L[i].amt||0)-c;ex-=c}
  if(mig)db.pay=db.pay.filter(p=>!(p.sid==id&&p.m==m&&!(+p.amt>0)));L=L.filter(p=>+p.amt>0);sum=tot}
 if(tot>sum){const e={id:nid(),sid:id,m:m,amt:tot-sum,date:'',note:'Previously recorded'};if(mig)db.pay.push(e);L=[e].concat(L)}
 return L.map(p=>({id:p.id,date:p.date||'',amt:+p.amt||0,note:p.note||''}));
}
const feeSync=(id,m)=>{db.fee[fk(id,m)]=db.pay.filter(p=>p.sid==id&&p.m==m).reduce((a,p)=>a+(+p.amt||0),0)};

 const ids=new Set(all.map(s=>s.id)),log=(db.pay||[]).filter(p=>p.m==S.m&&ids.has(p.sid)).sort((x,y)=>fcmp(y,x)).slice(0,25);

window.shareA4=async function(kind,id,n,forWhatsApp=false){
 const D=rcData(kind,id,n);if(!D)return;
 const person=D.p,num=pnum(person.phone)||pnum(person.phone2);
 if(forWhatsApp&&!num){alert('No valid parent/recipient phone number saved for '+person.name+'. Add it first (Edit).');return}
 try{
  setSy('Making A4 PDF...');
  await ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-9999px;top:0;background:#fff';
  host.innerHTML=rcA4(kind,id,n);document.body.appendChild(host);
  const cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff'});
  host.remove();
  const d=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  d.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
  const safeName=String(person.name||'Student').replace(/[^a-z0-9_-]+/gi,'_');
  const nm=(kind==='fee'?'Fee':'Salary')+'-Receipt-'+safeName+'-'+PN[n]+'.pdf';
  const fl=new File([d.output('blob')],nm,{type:'application/pdf'});
  const shareText=(kind==='fee'?'Fee receipt':'Salary statement')+' for '+person.name+' ('+PN[n]+'). '+SCH;
  if(forWhatsApp){setSy('');window.waPdfHandoff(d.output('blob'),nm,person,num,shareText);return}
  if(navigator.canShare&&navigator.canShare({files:[fl]})&&navigator.share){
   try{
    await navigator.share({files:[fl],title:nm,text:shareText});
    setSy('PDF share completed');
    return;
   }catch(e){
    if(e&&e.name==='AbortError'){setSy('');return}
   }
  }
  d.save(nm);
  setSy('PDF saved');
  if(forWhatsApp){
   const msg=shareText+' The A4 PDF has been downloaded. Please attach it in this WhatsApp chat.';
   openUrl(waUrl(num,msg),true);
   toast('📄','A4 PDF saved. Attach the downloaded PDF in WhatsApp.','c6');
  }else{
   toast('📄','A4 PDF saved - attach it in WhatsApp / SMS','c6');
  }
 }catch(e){
  setSy('PDF failed');
  alert('Could not make the PDF (needs internet once). Use Print A4 and save as PDF instead.');
 }};

function ageFromDOB(value){
  if(!value)return '';
  const p=String(value).trim().split(/[-/.]/);let y,m,d;
  if(p.length===3&&p[0].length===4){y=+p[0];m=+p[1];d=+p[2]}else if(p.length===3){d=+p[0];m=+p[1];y=+p[2]}else return '';
  const dob=new Date(y,m-1,d),now=new Date();
  if(!y||!m||!d||dob.getFullYear()!==y||dob.getMonth()!==m-1||dob.getDate()!==d||dob>now)return 'Invalid date';
  let years=now.getFullYear()-y,months=now.getMonth()-(m-1);
  if(now.getDate()<d)months--;if(months<0){years--;months+=12}
  return years+' year'+(years===1?'':'s')+' '+months+' month'+(months===1?'':'s');
}
function dateToISO(v){
  const a=String(v||'').trim().split(/[-/.]/);if(a.length!==3)return '';
  let d,m,y;if(a[0].length===4){y=+a[0];m=+a[1];d=+a[2]}else{d=+a[0];m=+a[1];y=+a[2]}
  if(y<100)y+=2000;const x=new Date(y,m-1,d);
  return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';
}
function dateToDMY(v){const a=String(v||'').split('-');return a.length===3&&a[0].length===4?a[2]+'-'+a[1]+'-'+a[0]:String(v||'')}
function prettifyDateEntry(el){
  if(!el||el.dataset.dateFormat==='dmy')return;
  const iso=el.value||'';el.type='text';el.inputMode='numeric';el.placeholder='DD-MM-YYYY';el.dataset.dateFormat='dmy';el.value=dateToDMY(iso);
  el.addEventListener('input',function(){
    const digits=this.value.replace(/\D/g,'').slice(0,8);
    if(digits.length>4)this.value=digits.slice(0,2)+'-'+digits.slice(2,4)+'-'+digits.slice(4);
    else if(digits.length>2)this.value=digits.slice(0,2)+'-'+digits.slice(2);
    if(this.id==='g_dob'){const a=document.getElementById('g_age');if(a)a.value=ageFromDOB(this.value)}
  });
}

<script id="fgs-timetable-a4-print-fix">

  const cleanup=()=>{
    document.documentElement.classList.remove('tt-print-mode');

<script id="fgs-a4-print-functions">
(function(){
  function makePrintRoot(){
    let root=document.getElementById('fgs-print-root');
    if(!root){root=document.createElement('div');root.id='fgs-print-root';document.body.appendChild(root)}
    root.innerHTML='';
    return root;
  }
  function prepareClone(node){
    const clone=node.cloneNode(true);
    clone.querySelectorAll('[onclick],[onchange],[oninput]').forEach(el=>{
      el.removeAttribute('onclick');el.removeAttribute('onchange');el.removeAttribute('oninput');
    });
    clone.querySelectorAll('input,select,button,textarea').forEach(el=>{
      if(el.tagName==='INPUT'){
        const span=document.createElement('span');
        span.textContent=el.type==='checkbox'?(el.checked?'✓':'—'):(el.value||'');
        el.replaceWith(span);
      }else if(el.tagName==='SELECT'){
        const span=document.createElement('span');span.textContent=el.selectedOptions?.[0]?.textContent||'';
        el.replaceWith(span);
      }else if(el.tagName==='TEXTAREA'){
        const span=document.createElement('span');span.textContent=el.value;el.replaceWith(span);
      }else el.remove();
    });
    clone.querySelectorAll('table').forEach(table=>{
      const first=table.rows&&table.rows[0];
      if(first&&first.querySelector('th')&&!table.tHead){
        const thead=document.createElement('thead');thead.appendChild(first.cloneNode(true));table.insertBefore(thead,table.firstChild);first.remove();
      }
    });
    return clone;
  }
  function printNode(node,title,opts={}){
    if(!node){alert('Nothing is available to print. Open the report or timetable first.');return}
    const root=makePrintRoot();
    const page=document.createElement('div');page.className='fgs-print-page';
    const clone=prepareClone(node);
    clone.id='sheet';
    clone.classList.remove('a6');
    page.appendChild(clone);
    root.appendChild(page);
    document.documentElement.classList.add('fgs-a4-printing');
    const clean=()=>{
      document.documentElement.classList.remove('fgs-a4-printing');
      root.innerHTML='';
      window.removeEventListener('afterprint',clean);
    };
    window.addEventListener('afterprint',clean,{once:true});
    setTimeout(()=>window.print(),180);
  }
  window.prn=function(){
    const node=document.getElementById('sheet');
    if(!node){alert('Open a report first.');return}
    printNode(node,'School Report');
  };
  window.printA4=function(kind,id,n){
    const markup=window.rcA4?window.rcA4(kind,id,n):'';
    if(!markup){alert('No transaction history is available for this selection.');return}
    const holder=document.createElement('div');holder.innerHTML=markup;
    const root=makePrintRoot(),page=document.createElement('div');page.className='fgs-print-page';
    page.innerHTML=holder.innerHTML;root.appendChild(page);
    document.documentElement.classList.add('fgs-a4-printing');
    const clean=()=>{document.documentElement.classList.remove('fgs-a4-printing');root.innerHTML='';window.removeEventListener('afterprint',clean)};
    window.addEventListener('afterprint',clean,{once:true});
    setTimeout(()=>window.print(),180);
  };
  window.printHistoryA4=function(){
    const kind=S.histType||'fee',id=S.histId,n=+(S.histMonths||6);
    if(!id){alert('Select a student or teacher before printing transaction history.');return}
    window.printA4(kind,id,n);
  };
  window.ttPrint=function(){
    const source=document.getElementById('sheet');
    if(!source){alert('Open the Timetable page first.');return}
    const root=makePrintRoot(),page=document.createElement('div');page.className='fgs-print-page';
    const clone=prepareClone(source);clone.id='sheet';clone.classList.remove('a6');
    page.appendChild(clone);root.appendChild(page);
    document.documentElement.classList.add('fgs-a4-printing');
    const clean=()=>{document.documentElement.classList.remove('fgs-a4-printing');root.innerHTML='';window.removeEventListener('afterprint',clean)};
    window.addEventListener('afterprint',clean,{once:true});
    setTimeout(()=>window.print(),180);
  };
})();
</script>

  /* ---------- SALARY SLIP (A6) ---------- */
  window.slip=slip=function(s,x,rem){

    const status=rem<=0?'PAID IN FULL':pd>0?'PARTIALLY PAID':'UNPAID';
    const no=String(s.id).slice(-4).padStart(4,'0')+'-'+String(S.m).replace('-','');
    const thanks=(db.receiptSettings&&db.receiptSettings.thankYouText)||'THANK YOU FOR YOUR SERVICE!';

      </tbody></table>

        <thead><tr><th>Description</th><th class="r">Amount (PKR)</th></tr></thead><tbody>
        <tr><td>Fixed Monthly Salary</td><td class="r">${E(N(sal))}</td></tr>

  };

  /* ---------- printing ---------- */
  function mkRoot(){let r=document.getElementById('fgs-print-root');if(!r){r=document.createElement('div');r.id='fgs-print-root';document.body.appendChild(r)}r.innerHTML='';return r}
  function setPage(css){
    let e=document.getElementById('fgs-page-rule');if(e)e.remove();
    e=document.createElement('style');e.id='fgs-page-rule';e.textContent=css;document.body.appendChild(e);
  }
  function clearPage(){const e=document.getElementById('fgs-page-rule');if(e)e.remove()}
  window.fgsSetPage=setPage;
  const PAGE_A4_FLOW='@page{size:A4 portrait;margin:8mm}';
  const PAGE_A4_FIXED='@page{size:A4 portrait;margin:0}';
  const PAGE_A6='@page{size:105mm 148mm;margin:0}';

  function prep(node){
    const c=node.cloneNode(true);
    c.querySelectorAll('[onclick],[onchange],[oninput]').forEach(el=>{el.removeAttribute('onclick');el.removeAttribute('onchange');el.removeAttribute('oninput')});
    c.querySelectorAll('.cr-fit').forEach(el=>el.remove());
    c.querySelectorAll('input,select,button,textarea').forEach(el=>{
      if(el.tagName==='INPUT'){const sp=document.createElement('span');sp.textContent=el.type==='checkbox'?(el.checked?'✓':'—'):(el.value||'');el.replaceWith(sp)}
      else if(el.tagName==='SELECT'){const sp=document.createElement('span');sp.textContent=(el.selectedOptions&&el.selectedOptions[0]?el.selectedOptions[0].textContent:'');el.replaceWith(sp)}
      else if(el.tagName==='TEXTAREA'){const sp=document.createElement('span');sp.textContent=el.value;el.replaceWith(sp)}
      else el.remove();
    });
    c.querySelectorAll('table').forEach(t=>{
      const f=t.rows&&t.rows[0];
      if(f&&f.querySelector('th')&&!t.tHead&&!t.classList.contains('cr-t')){const th=document.createElement('thead');th.appendChild(f.cloneNode(true));t.insertBefore(th,t.firstChild);f.remove()}
    });
    return c;
  }
  function launch(pageClass,pageCss,fill){
    const root=mkRoot(),page=document.createElement('div');
    page.className='fgs-print-page '+pageClass;
    fill(page);root.appendChild(page);
    setPage(pageCss);
    document.documentElement.classList.add('fgs-a4-printing');
    const clean=()=>{document.documentElement.classList.remove('fgs-a4-printing');root.innerHTML='';clearPage();window.removeEventListener('afterprint',clean)};
    window.addEventListener('afterprint',clean);
    setTimeout(()=>window.print(),220);
  }

  function printA4Sheet(node,fixed){
    launch(fixed?'fgs-fixed':'fgs-a4',fixed?PAGE_A4_FIXED:PAGE_A4_FLOW,page=>{
      const c=prep(node);c.id='sheet';c.classList.remove('a6');page.appendChild(c);
    });
  }
  function printA6Sheet(node){
    window.fgsFitAll(node);                       /* fit while visible, on screen */
    launch('fgs-a6',PAGE_A6,page=>{
      const c=prep(node);c.id='sheet';page.appendChild(c);
    });
  }

  const basePrn=function(){
    const node=document.getElementById('sheet');
    if(!node){alert('Open a report first.');return}
    const rt=(typeof S!=='undefined'&&S.rt)||'';
    if(rt==='rcpt'||rt==='slip'||node.classList.contains('cr6'))printA6Sheet(node);
    else printA4Sheet(node,FIXED.includes(rt));
  };
  window.prn=prn=function(){
    const rep=((document.querySelector('#sheet .rt')||{}).textContent||(typeof S!=='undefined'&&S.rt)||'School-Report').trim();
    if(typeof withPdfTitle==='function')withPdfTitle(rep,basePrn);else basePrn();
  };

  /* other A4 printers (payment history, timetable) keep their own copy logic but get a correct page rule */
  ['printA4','ttPrint'].forEach(name=>{
    const orig=window[name];if(typeof orig!=='function')return;
    window[name]=function(){
      setPage(PAGE_A4_FLOW);
      const clean=()=>{clearPage();window.removeEventListener('afterprint',clean)};
      window.addEventListener('afterprint',clean);
      return orig.apply(this,arguments);
    };
  });

  /* receipt button label + redraw if a receipt is open */
  try{if(typeof S!=='undefined'&&(S.rt==='rcpt'||S.rt==='slip')&&typeof R==='function')R()}catch(e){}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{try{window.fgsFitAll(document)}catch(e){}});
})();
</script>

<script id="ad-dashboard">
/* ===== DASHBOARD (Academy-style): date filters + 10 live KPI cards + Overdue Fees panel ===== */
(function(){
 'use strict';
 if(!S.dp)S.dp='all';
 const PRESETS=[['today','Today'],['yesterday','Yesterday'],['last7','Last 7 Days'],['last30','Last 30 Days'],['month','This Month'],['prev','Previous Month'],['all','All Time'],['custom','Custom']];
 const iso=d=>d.toISOString().slice(0,10);
 const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
 const addM=(ym,n)=>{const p=ym.split('-').map(Number);return iso(new Date(Date.UTC(p[0],p[1]-1+n,1))).slice(0,7)};
 const mEnd=ym=>{const p=ym.split('-').map(Number);return iso(new Date(Date.UTC(p[0],p[1],0)))};
 const monthsBetween=(a,b)=>{const o=[];let m=a;while(m<=b&&o.length<600){o.push(m);m=addM(m,1)}return o};
 const isYM=m=>/^\d{4}-\d{2}$/.test(m||'');

 function range(){
  const td=TD(),cm=td.slice(0,7);
  switch(S.dp){
   case 'today':return{a:td,b:td};
   case 'yesterday':{const y=addD(td,-1);return{a:y,b:y}}
   case 'last7':return{a:addD(td,-6),b:td};
   case 'last30':return{a:addD(td,-29),b:td};
   case 'month':return{a:cm+'-01',b:mEnd(cm)};
   case 'prev':{const pm=addM(cm,-1);return{a:pm+'-01',b:mEnd(pm)}}
   case 'custom':{let a=S.dfa||td,b=S.dfb||td;if(a>b){const t=a;a=b;b=t}return{a:a,b:b}}
   default:return{a:null,b:null};
  }
 }
 const inR=(d,r)=>!r.a||(d>=r.a&&d<=r.b);
 function firstMonth(){
  let f=TD().slice(0,7);
  Object.keys(db.fee||{}).forEach(k=>{const m=k.split('|')[1];if(isYM(m)&&m<f)f=m});
  Object.keys(db.sal||{}).forEach(k=>{const m=k.split('|')[1];if(isYM(m)&&m<f)f=m});
  (db.pay||[]).forEach(p=>{if(isYM(p.m)&&p.m<f)f=p.m});
  return f;
 }
 /* money received for one student-month, as dated entries (does not change any data) */
 function entries(s,m){
  const tot=fp(s.id,m);if(!(tot>0))return[];
  const L=(db.pay||[]).filter(p=>p.sid==s.id&&p.m==m).map(p=>({date:p.date||'',amt:+p.amt||0})).sort((x,y)=>x.date.localeCompare(y.date));
  const sum=L.reduce((a,p)=>a+p.amt,0),out=[];
  if(tot>sum)out.push({date:'',amt:tot-sum});
  let ex=Math.max(0,sum-tot);
  for(let i=L.length-1;i>=0&&ex>0;i--){const c=Math.min(ex,L[i].amt);L[i].amt-=c;ex-=c}
  return out.concat(L.filter(x=>x.amt>0));
 }
 function compute(){
  const r=range(),td=TD(),cm=td.slice(0,7),fm=firstMonth(),L=ST(),F=SF();
  const a0=r.a?r.a.slice(0,7):fm, b0=r.b?r.b.slice(0,7):cm;
  const mFrom=a0<fm?fm:a0, mTo=b0>cm?cm:b0;
  const mAll=monthsBetween(fm,cm), mSel=mFrom<=mTo?monthsBetween(mFrom,mTo):[];
  let collected=0,outstanding=0,nOver=0,nDue=0,nPart=0,overAmt=0;const list=[];
  L.forEach(s=>{
   const sm=(s.adate||'').slice(0,7);
   mAll.forEach(m=>{entries(s,m).forEach(e=>{if(inR(e.date||(m+'-01'),r))collected+=e.amt})});
   mSel.forEach(m=>{
    if(isYM(sm)&&m<sm)return;
    const paid=fp(s.id,m),bal=Math.max(0,(+s.fee||0)-paid);if(bal<=0)return;
    outstanding+=bal;
    const over=frOverdue(m);
    if(over){nOver++;overAmt+=bal}else if(paid>0){}else nDue++;
    if(paid>0)nPart++;
    list.push({s:s,m:m,paid:paid,bal:bal,st:over?'od':(paid>0?'pt':'du')});
   });
  });
  let exp=(db.ex||[]).filter(x=>x.date&&inR(String(x.date).slice(0,10),r)).reduce((a,x)=>a+(+x.amt||0),0);
  let salary=0,salNote=false;
  mAll.forEach(m=>{
   if(r.a&&!(m+'-01'>=r.a&&mEnd(m)<=r.b))return;

  const used=[];(db.st||[]).forEach(s=>s&&s.cls&&used.push(s.cls));(db.ts||[]).forEach(t=>t&&t.cls&&used.push(t.cls));
  used.forEach(c=>{if(!db.cl.includes(c))db.cl.push(c)});
  CL.splice(0,CL.length,...db.cl);
 }
 const _ens=ensure;ensure=function(){_ens.apply(this,arguments);sync()};
 sync();

 if(!P.some(x=>x[0]==='cls')){const k=P.findIndex(x=>x[0]==='stu');P.splice(k+1,0,['cls','Classes','🏫','c8'])}

 const counts=()=>{const c={};(db.st||[]).forEach(s=>{c[s.cls]=(c[s.cls]||0)+1});return c};
 const testsOf=n=>(db.ts||[]).filter(t=>t.cls===n).length;
 const slotsOf=n=>Object.keys((db.tt&&db.tt.c)||{}).filter(k=>k.startsWith(n+'|')).length;
 const teachers=()=>[...new Set([...(db.tl||[]),...(db.sf||[]).map(x=>x.name)].filter(Boolean))];

 const CM=window.CMgr={q:'',sel:{i:'📘',c:PAL[0]},
  find(v){CM.q=v;const q=String(v||'').trim().toLowerCase();document.querySelectorAll('.cm-card').forEach(e=>{e.style.display=!q||(e.dataset.s||'').includes(q)?'':'none'})},
  view(i){S.c=db.cl[i];go('stu')},
  pick(k,b){CM.sel[k]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))},
  form(mode,i){
   const add=mode==='add',ren=mode==='ren',n=add?'':db.cl[i],m=meta(n);
   CM.sel={i:m.i||dIcon(n),c:m.c||PAL[(add?db.cl.length:i)%PAL.length]};
   const title=add?'Add Class':ren?'Rename Class':'Edit Class',ico=add?SV.plus:ren?SV.ren:SV.edit;
   const nameF=!add&&!ren?`<div class="cm-fix"><span>Class</span><b>${esc(n)}</b></div>`:`<label>Class name</label><input id="cm_n" maxlength="30" value="${esc(n)}" placeholder="e.g. Class 6 - A" autocomplete="off">`;
   const impact=ren?(()=>{const a=counts()[n]||0,b=testsOf(n),c=slotsOf(n);return `<div class="cm-note">Students (${a}), tests (${b}) and timetable periods (${c}) of this class are updated to the new name automatically.</div>`})():'';
   const det=ren?'':`<label>Class teacher</label><input id="cm_t" list="cm_tl" value="${esc(m.t||'')}" placeholder="Select or type teacher name" autocomplete="off"><datalist id="cm_tl">${teachers().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <label>Section / Room</label><input id="cm_r" value="${esc(m.r||'')}" placeholder="e.g. Section A, Room 4" maxlength="40" autocomplete="off">
    <label>Icon</label><div class="cm-pick">${ICONS.map(x=>`<button type="button" data-v="${x}" class="${x===CM.sel.i?'on':''}" onclick="CMgr.pick('i',this)">${x}</button>`).join('')}</div>
    <label>Colour</label><div class="cm-pick cl">${PAL.map(x=>`<button type="button" data-v="${x}" style="background:${x}" class="${x===CM.sel.c?'on':''}" onclick="CMgr.pick('c',this)" aria-label="${x}"></button>`).join('')}</div>`;
   $('#modal').innerHTML=`<div class="mb"><div class="cm-h"><span>${ico}</span><h3>${title}</h3></div>${nameF}${det}${impact}<div class="row"><button class="b" onclick="cl()">Cancel</button><button class="b c1" onclick="CMgr.save('${mode}',${i===undefined?-1:i})">${SV.check.replace('<svg','<svg style="width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.5;vertical-align:-2px;margin-right:4px"')}Save</button></div></div>`;
   $('#modal').style.display='flex';const f=$('#cm_n');if(f)setTimeout(()=>f.focus(),50);
  },
  save(mode,i){
   sync();const nEl=$('#cm_n'),old=i>=0?db.cl[i]:'';
   let name=nEl?nEl.value.trim().replace(/\s+/g,' '):old;
   if(!name){alert('Please enter a class name.');return}
   if(db.cl.some((x,k)=>String(x).toLowerCase()===name.toLowerCase()&&!(mode!=='add'&&k===i))){alert('A class named "'+name+'" already exists.');return}
   const tEl=$('#cm_t'),rEl=$('#cm_r');
   if(mode==='add'){
    db.cl.push(name);db.cm[name]={t:tEl?tEl.value.trim():'',r:rEl?rEl.value.trim():'',i:CM.sel.i,c:CM.sel.c};
    tell('🏫','Class "'+name+'" added');
   }else if(mode==='ren'){
    CM.renameTo(i,name);tell('✏️','Class renamed to "'+name+'"');
   }else{
    db.cm[old]=Object.assign({},meta(old),{t:tEl?tEl.value.trim():'',r:rEl?rEl.value.trim():'',i:CM.sel.i,c:CM.sel.c});
    tell('✅','Class "'+old+'" updated');
   }
   cl();save();R();
  },
  renameTo(i,nw){
   const old=db.cl[i];if(old===nw)return;
   db.cl[i]=nw;
   (db.st||[]).forEach(s=>{if(s.cls===old)s.cls=nw});
   (db.ts||[]).forEach(t=>{if(t.cls===old)t.cls=nw});
   const c=db.tt&&db.tt.c;if(c)Object.keys(c).forEach(k=>{if(k.startsWith(old+'|')){c[nw+k.slice(old.length)]=c[k];delete c[k]}});
   if(db.cm[old]){db.cm[nw]=db.cm[old];delete db.cm[old]}
   ['c','tc','xc','mc','ec'].forEach(k=>{if(S[k]===old)S[k]=nw});
   sync();
  },
  del(i){
   sync();const n=db.cl[i];if(n===undefined)return;
   const a=counts()[n]||0,b=testsOf(n),s=slotsOf(n);
   if(a||b){alert('"'+n+'" cannot be deleted yet.\n\nIt still has '+a+' student(s) and '+b+' test(s).\nMove the students to another class (Students > Edit) and remove the tests first, or simply rename the class.');return}
   if(!confirm('Delete class "'+n+'"?'+(s?'\n\nIts '+s+' timetable period(s) will also be removed.':'')))return;
   db.cl.splice(i,1);delete db.cm[n];
   const c=db.tt&&db.tt.c;if(c)Object.keys(c).forEach(k=>{if(k.startsWith(n+'|'))delete c[k]});
   ['c','tc','xc','mc','ec'].forEach(k=>{if(S[k]===n)S[k]=(k==='tc'?undefined:'All')});
   sync();save();tell('🗑️','Class "'+n+'" deleted','c4');R();
  },
  move(i,d){const j=i+d;if(j<0||j>=db.cl.length)return;const t=db.cl[i];db.cl[i]=db.cl[j];db.cl[j]=t;sync();save();R()}
 };

 V.cls=function(){
  sync();const cn=counts(),total=db.cl.length,enrolled=(db.st||[]).length,empty=db.cl.filter(c=>!cn[c]).length,withT=db.cl.filter(c=>meta(c).t).length;
  const st=(ic,l,v,c)=>`<div class="cm-stat" style="--cc:${c}"><span class="si">${ic}</span><div><div class="sl">${l}</div><div class="sv">${v}</div></div></div>`;
  const cards=db.cl.map((c,i)=>{
   const m=meta(c),col=m.c||PAL[i%PAL.length],n=cn[c]||0,search=(c+' '+(m.t||'')+' '+(m.r||'')).toLowerCase();
   return `<div class="cm-card" style="--cc:${col}" data-s="${esc(search)}">
    <div class="cm-hd"><span class="cm-ic">${m.i||dIcon(c)}</span><div class="cm-nm"><b>${esc(c)}</b><small>${esc(m.r||'No section / room set')}</small></div><span class="cm-no">#${i+1}</span></div>
    <div class="cm-ct"><div>${SV.users}<span><b>${n}</b> ${n===1?'student':'students'}</span></div><div>${SV.user}<span>${m.t?esc(m.t):'No class teacher assigned'}</span></div></div>
    <div class="cm-ac"><button onclick="CMgr.view(${i})" title="View students">${SV.users}Students</button><button onclick="CMgr.form('edit',${i})" title="Edit details">${SV.edit}Edit</button><button onclick="CMgr.form('ren',${i})" title="Rename class">${SV.ren}Rename</button><button class="dg" onclick="CMgr.del(${i})" title="Delete class">${SV.del}Delete</button><span class="sp"></span><button class="ic1" ${i===0?'disabled':''} onclick="CMgr.move(${i},-1)" title="Move up" aria-label="Move up">${SV.up}</button><button class="ic1" ${i===total-1?'disabled':''} onclick="CMgr.move(${i},1)" title="Move down" aria-label="Move down">${SV.dn}</button></div>
   </div>`}).join('');
  return `<h2>Class Management</h2>
  <div class="cm-stats">${st(SV.school,'Total Classes',total,'#0f766e')}${st(SV.users,'Students Enrolled',enrolled,'#4338ca')}${st(SV.user,'Teachers Assigned',withT+' / '+total,'#c2410c')}${st(SV.alert,'Classes Without Students',empty,'#be185d')}</div>
  <div class="cm-bar"><div class="cm-search">${SV.search}<input type="search" placeholder="Search class, teacher or room" oninput="CMgr.find(this.value)" value="${esc(CM.q)}"></div><button class="cm-add" onclick="CMgr.form('add')">${SV.plus}Add Class</button></div>
  ${total?`<div class="cm-grid">${cards}</div>`:`<div class="cm-empty">No classes yet. Tap <b>Add Class</b> to create your first class.</div>`}`;
 };

 /* timetable: never open on a class that no longer exists */
 const _tt=V.tt;V.tt=function(){if(S.tc&&S.tc!=='All'&&!CL.includes(S.tc))S.tc=CL[0]||'All';if(!S.tc&&!CL.includes('Class 9'))S.tc=CL[0]||'All';return _tt.apply(this,arguments)};
})();
</script>
